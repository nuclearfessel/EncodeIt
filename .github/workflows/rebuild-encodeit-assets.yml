# Rebuild an existing release from its tag with the EncodeIt product name,
# then replace the files attached to that release.
name: Rebuild EncodeIt release files

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-encodeit-releases
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        tag: [v0.1.1, v0.1.2, v0.1.3, v0.1.4, v0.1.5]
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ matrix.tag }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Use the current FFmpeg downloader
        run: |
          git fetch --depth=1 origin main
          git checkout FETCH_HEAD -- scripts/download-ffmpeg.mjs

      - name: Point this build at EncodeIt
        run: |
          node <<'NODE'
          const fs = require('fs')

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          pkg.name = 'encodeit'
          if (!pkg.author || !String(pkg.author).includes('@')) {
            pkg.author = 'nuclearfessel <nuclearfessel@users.noreply.github.com>'
          }
          pkg.build = pkg.build || {}
          pkg.build.appId = 'com.encodeit.app'
          pkg.build.productName = 'EncodeIt'
          pkg.build.executableName = 'EncodeIt'
          pkg.build.nsis = Object.assign({}, pkg.build.nsis, {
            artifactName: 'EncodeIt.Setup.${version}.exe'
          })
          pkg.build.portable = Object.assign({}, pkg.build.portable, {
            artifactName: 'EncodeIt.${version}.exe'
          })
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n')

          const lockPath = 'package-lock.json'
          if (fs.existsSync(lockPath)) {
            const lock = fs
              .readFileSync(lockPath, 'utf8')
              .replaceAll('"name": "encode-this"', '"name": "encodeit"')
            fs.writeFileSync(lockPath, lock)
          }

          const cepScript = 'scripts/package-ae-cep.mjs'
          if (fs.existsSync(cepScript)) {
            const text = fs
              .readFileSync(cepScript, 'utf8')
              .replaceAll('encode-this-ae', 'encodeit-ae')
            fs.writeFileSync(cepScript, text)
          }

          const cepDir = 'integrations/after-effects/cep'
          if (fs.existsSync(cepDir)) {
            const walk = (dir) => {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = `${dir}/${entry.name}`
                if (entry.isDirectory()) {
                  walk(full)
                  continue
                }
                const body = fs.readFileSync(full)
                if (body.includes(0)) continue
                const next = body
                  .toString('utf8')
                  .replaceAll('encode-this-ae', 'encodeit-ae')
                if (next !== body.toString('utf8')) fs.writeFileSync(full, next)
              }
            }
            walk(cepDir)
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Build installers
        run: npm run dist -- --${{ matrix.os == 'windows-latest' && 'win' || matrix.os == 'macos-latest' && 'mac' || 'linux' }}

      - name: Package AE CEP zip
        if: matrix.os == 'windows-latest'
        run: |
          if [ -f scripts/package-ae-cep.mjs ]; then
            node scripts/package-ae-cep.mjs
          fi

      - name: Reject leftover Encode This filenames
        run: |
          set -euo pipefail
          if find release -type f -print | grep -Ei 'encode[-. ]this'; then
            echo "Build still produced Encode This filenames."
            exit 1
          fi
          for zip in release/*-mac.zip; do
            [ -f "$zip" ] || continue
            if unzip -l "$zip" | grep -Ei 'encode this|encode-this|Encode\.This'; then
              echo "Mac archive still contains Encode This paths."
              exit 1
            fi
          done

      - name: Replace release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release/*.exe release/*.dmg release/*.pkg release/*-mac.zip release/*.AppImage release/*.deb release/encodeit-ae-cep.zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No installer files were produced."
            exit 1
          fi
          printf 'Uploading:\n'
          printf '  %s\n' "${files[@]}"
          gh release upload "${{ matrix.tag }}" "${files[@]}" --clobber
