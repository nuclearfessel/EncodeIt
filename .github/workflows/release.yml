# Build installers (+ Linux AppImage) and attach them to a GitHub Release when a version tag is pushed.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # No GH_TOKEN here — publish is disabled; we only attach installers below (no auto-update).
      - name: Download FFmpeg + build + package
        run: npm run dist -- --${{ matrix.platform }}

      - name: Package AE CEP zip
        if: matrix.platform == 'win'
        run: npm run package:cep

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v3
        with:
          # Prepended to GitHub’s auto-generated changelog (commits since last tag).
          body_path: docs/RELEASE_DOWNLOADS.md
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.dmg
            release/*.pkg
            release/*-mac.zip
            release/*.AppImage
            release/*.deb
            release/encodeit-ae-cep.zip
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
