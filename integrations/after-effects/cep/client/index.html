<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>EncodeIt</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: 'Source Sans 3', 'Segoe UI', sans-serif;
      }
      body {
        margin: 0;
        padding: 12px;
        background: #1a1a1a;
        color: #e6e6e6;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 10px;
      }
      label {
        display: block;
        font-size: 11px;
        opacity: 0.7;
        margin: 8px 0 4px;
      }
      input,
      select,
      button {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
        border-radius: 4px;
        border: 1px solid #3a3a3a;
        background: #141414;
        color: #e6e6e6;
        font: inherit;
      }
      button {
        margin-top: 12px;
        background: #3d9cf0;
        border-color: #2f87d6;
        color: #041018;
        font-weight: 600;
        cursor: pointer;
      }
      button.secondary {
        background: #222;
        border-color: #3a3a3a;
        color: #e6e6e6;
        margin-top: 6px;
      }
      #status {
        margin-top: 10px;
        font-size: 11px;
        opacity: 0.85;
        white-space: pre-wrap;
      }
      .ok {
        color: #3ecf8e;
      }
      .err {
        color: #e26666;
      }
    </style>
  </head>
  <body>
    <h1>EncodeIt</h1>
    <p style="font-size: 12px; opacity: 0.75; margin-top: 0">
      Send a rendered file into the EncodeIt queue (app must be running with host intake on).
    </p>
    <label for="port">Intake port</label>
    <input id="port" value="47821" />
    <label for="preset">Preset</label>
    <select id="preset">
      <option value="h264-match-source-high-bitrate">Loading presets…</option>
    </select>
    <button id="refresh" class="secondary" type="button">Refresh presets</button>
    <label for="path">Media path</label>
    <input id="path" placeholder="D:\renders\comp.mp4" />
    <button id="send" type="button">Send to queue + start</button>
    <div id="status"></div>
    <script src="./main.js"></script>
  </body>
</html>
