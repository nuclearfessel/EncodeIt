<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Encode This</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        padding: 12px;
        background: #1c1c1c;
        color: #eee;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 10px;
      }
      label {
        display: block;
        font-size: 11px;
        opacity: 0.7;
        margin: 8px 0 4px;
      }
      input,
      select,
      button {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
        border-radius: 4px;
        border: 1px solid #444;
        background: #111;
        color: #eee;
      }
      button {
        margin-top: 12px;
        background: #3d9cf0;
        border-color: #2f87d6;
        color: #041018;
        font-weight: 600;
        cursor: pointer;
      }
      #status {
        margin-top: 10px;
        font-size: 11px;
        opacity: 0.85;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>Encode This</h1>
    <p style="font-size: 12px; opacity: 0.75; margin-top: 0">
      Send a rendered file into the Encode This queue (app must be running).
    </p>
    <label for="port">Intake port</label>
    <input id="port" value="47821" />
    <label for="preset">Preset id</label>
    <input id="preset" value="h264-match-source-high-bitrate" />
    <label for="path">Media path</label>
    <input id="path" placeholder="D:\renders\comp.mp4" />
    <button id="send" type="button">Send to queue + start</button>
    <div id="status"></div>
    <script src="./main.js"></script>
  </body>
</html>
